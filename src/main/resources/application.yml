server:
  port: 8080

spring:
  application:
    name: Products
  datasource:
    url: jdbc:h2:mem:productsdb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none

logging:
  level:
    root: INFO
    org.springframework: INFO